[project]
name = "yase"
version = "0.2.0"
description = "Dependency-light semantic extraction for images and real-time video."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yase contributors" }]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.2",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
torch = ["torch>=2.0", "torchvision>=0.15"]
all = ["opencv-python>=4.8", "torch>=2.0", "torchvision>=0.15"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yase"]

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.6",
  "build>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv]
default-groups = ["dev"]

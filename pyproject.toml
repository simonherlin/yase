[project]
name = "yase"
version = "0.35.0"
description = "Dependency-light semantic extraction for images and real-time video."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yase contributors" }]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.2",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
torch = ["torch>=2.0", "torchvision>=0.15"]
onnx = ["onnxruntime>=1.17"]
transformers = ["torch>=2.0", "transformers>=4.45"]
ocr = ["pytesseract>=0.3.13"]
paddle = ["paddleocr>=2.9"]
retrieval = ["qdrant-client>=1.14"]
observability = ["opentelemetry-api>=1.30"]
openvino = ["openvino>=2024.0"]
tensorrt = ["tensorrt>=10.0"]
all = [
  "opencv-python>=4.8",
  "onnxruntime>=1.17",
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.45",
  "pytesseract>=0.3.13",
  "paddleocr>=2.9",
  "qdrant-client>=1.14",
  "opentelemetry-api>=1.30",
]

[project.scripts]
yase = "yase.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/src/yase/data_load.py",
  "/src/yase/features.py",
  "/src/yase/models/**",
  "/src/yase/preprocess.py",
  "/src/yase/tests/**",
  "/src/yase/utils/**",
  "/src/yase/visualize.py",
  "/src/yase/weights/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yase"]

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.6",
  "build>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["yase"]
omit = [
  "*/yase/adapters.py",
  "*/yase/cli.py",
  "*/yase/retrieval.py",
  "*/yase/data_load.py",
  "*/yase/features.py",
  "*/yase/models/*",
  "*/yase/preprocess.py",
  "*/yase/tests/*",
  "*/yase/utils/*",
  "*/yase/visualize.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv]
default-groups = ["dev"]

[project]
name = "yase"
version = "0.66.0"
description = "Dependency-light semantic extraction for images and real-time video."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Yase contributors" }]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.2",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
torch = ["torch>=2.0", "torchvision>=0.15"]
onnx = ["onnxruntime>=1.17,<2"]
onnx-gpu = ["onnxruntime-gpu>=1.17,<2"]
transformers = ["torch>=2.0", "transformers>=4.45,<6"]
ocr = ["pytesseract>=0.3.13"]
paddle = ["paddleocr>=2.9"]
retrieval = ["qdrant-client>=1.14"]
observability = ["opentelemetry-api>=1.30"]
openvino = ["openvino>=2024.0"]
tensorrt = ["tensorrt>=10.0"]
rfdetr = [
  "rfdetr>=1.6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=5.1,<6",
]
all = [
  "opencv-python>=4.8",
  "onnxruntime>=1.17,<2",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=5.1,<6",
  "pytesseract>=0.3.13",
  "paddleocr>=2.9",
  "qdrant-client>=1.14",
  "opentelemetry-api>=1.30",
  "openvino>=2024.0",
  "rfdetr>=1.6.0",
]
all-gpu = [
  "opencv-python>=4.8",
  "onnxruntime-gpu>=1.17,<2",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=5.1,<6",
  "pytesseract>=0.3.13",
  "paddleocr>=2.9",
  "qdrant-client>=1.14",
  "opentelemetry-api>=1.30",
  "openvino>=2024.0",
  "rfdetr>=1.6.0",
  "tensorrt>=10.0",
]

[project.scripts]
yase = "yase.cli:main"

[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yase = ["py.typed"]

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.6",
  "build>=1.2",
]
runtime-test = [
  "onnx>=1.17",
  "onnxruntime>=1.17",
  "openvino>=2024.0",
  "opentelemetry-api>=1.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["yase"]
omit = [
  "*/yase/adapters.py",
  "*/yase/cli.py",
  "*/yase/retrieval.py",
  "*/yase/data_load.py",
  "*/yase/features.py",
  "*/yase/models/*",
  "*/yase/preprocess.py",
  "*/yase/tests/*",
  "*/yase/utils/*",
  "*/yase/visualize.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv]
default-groups = ["dev"]

[tool.cibuildwheel]
# Native wheels are the optimized distribution profile. The regular `build`
# target deliberately remains a portable py3-none-any wheel.
build = "cp310-* cp311-* cp312-* cp313-*"
environment = { YASE_BUILD_NATIVE = "1" }
test-command = "python -c \"import yase; from yase.native import NATIVE_AVAILABLE; assert NATIVE_AVAILABLE\""

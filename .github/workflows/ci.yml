name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --dev
      - run: uv run ruff check src tests examples benchmarks
      - run: uv run ruff format --check src tests examples benchmarks
      - run: uv run pytest --cov=yase --cov-report=term-missing
      - run: uv build
      - run: |
          uv venv --python ${{ matrix.python-version }} .wheel-env
          uv pip install --python .wheel-env/bin/python dist/*.whl
          .wheel-env/bin/python - <<'PY'
          import pathlib
          import sys
          import yase
          assert 'torch' not in sys.modules
          assert 'cv2' not in sys.modules
          assert pathlib.Path(yase.__file__).with_name('py.typed').exists()
          print(yase.__version__)
          PY

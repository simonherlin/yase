name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run python -m build --sdist --wheel
      - name: Verify package artifacts
        run: |
          uv run python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          artifacts = sorted(pathlib.Path("dist").iterdir())
          assert any(path.suffix == ".whl" for path in artifacts)
          assert any(path.suffix == ".gz" for path in artifacts)
          wheel = next(path for path in artifacts if path.suffix == ".whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "yase/__init__.py",
              "yase/cli.py",
              "yase/limits.py",
              "yase/observability.py",
          }
          missing = required - names
          assert not missing, sorted(missing)
          assert not any(name.startswith("yase/_native") for name in names)
          source = next(path for path in artifacts if path.suffixes[-2:] == [".tar", ".gz"])
          with tarfile.open(source) as archive:
              source_names = set(archive.getnames())
          assert any(name.endswith("native/yase_native.cpp") for name in source_names)
          assert any(name.endswith("tools/build_native.py") for name in source_names)
          PY
      - run: uv run yase diagnostics --require numpy
      - run: uv venv .venv-wheel --python 3.11
      - run: uv pip install --python .venv-wheel/bin/python dist/*.whl
      - name: Smoke test portable wheel fallback
        run: |
          .venv-wheel/bin/python - <<'PY'
          from yase.native import NATIVE_AVAILABLE, nms_indices

          assert not NATIVE_AVAILABLE
          assert nms_indices([(0, 0, 2, 2), (0, 0, 2, 2)], [0.9, 0.8]) == [0]
          PY

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run python tools/build_native.py
      - run: uv run pytest -q -k "iou_matrix or tracking"
      - name: Import in-place native extension
        run: |
          uv run python - <<'PY'
          from yase.native import NATIVE_AVAILABLE, iou_matrix

          assert NATIVE_AVAILABLE
          assert iou_matrix([(0, 0, 2, 2)], [(1, 1, 3, 3)])[0][0] > 0
          PY
